<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#05070b">

    <title>Pathfolio — Your achievements. Your future.</title>

    <meta name="description"
        content="Organize your achievements into a portfolio that moves you forward.">

    <style>

        /* ─────────────────────────────────────────
           PATHFOLIO — MAIN DESIGN
        ───────────────────────────────────────── */

        :root {
            color-scheme: dark;

            --bg: #05070b;
            --panel: #0d1420;
            --panel-light: #111b29;
            --panel2: #0a0f18;

            --line: #1d2a3d;
            --line-light: #2a3d57;

            --text: #f5f7fb;
            --muted: #9aa8bc;

            --blue: #4c8dff;
            --electric: #65b8ff;
            --purple: #8c7dff;
            --good: #72ddb1;
            --danger: #ff858e;

            font: 15px/1.55 Inter, ui-sans-serif, system-ui,
                -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;

            background:
                radial-gradient(ellipse at 15% -10%, #102345 0, transparent 42%),
                radial-gradient(ellipse at 90% 10%, #111b38 0, transparent 35%),
                var(--bg);

            color: var(--text);
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        button {
            color: inherit;
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* ─────────────────────────────────────────
           ANIMATIONS
        ───────────────────────────────────────── */

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes softGlow {
            0%, 100% {
                box-shadow: 0 0 25px #4c8dff22;
            }

            50% {
                box-shadow: 0 0 45px #4c8dff44;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(1deg);
            }

            50% {
                transform: translateY(-7px) rotate(1deg);
            }
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(15px) scale(.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .animate-in {
            animation: fadeUp .55s cubic-bezier(.2, .8, .2, 1) both;
        }

        /* ─────────────────────────────────────────
           GENERAL LAYOUT
        ───────────────────────────────────────── */

        .shell {
            max-width: 1200px;
            margin: auto;
            padding: 0 28px;
        }

        /* ─────────────────────────────────────────
           TOP BAR
        ───────────────────────────────────────── */

        .top {
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid #ffffff0d;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;

            font-size: 19px;
            font-weight: 720;
            letter-spacing: -.04em;

            transition: transform .25s ease;
        }

        .brand:hover {
            transform: scale(1.025);
        }

        .logo {
            width: 31px;
            height: 31px;

            display: grid;
            place-items: center;

            border-radius: 10px;

            background:
                linear-gradient(145deg, #73c5ff, #3976ef);

            color: #06101f;
            font-weight: 900;

            box-shadow: 0 0 28px #4c8dff44;

            transition: transform .35s cubic-bezier(.2, .9, .3, 1);
        }

        .brand:hover .logo {
            transform: rotate(-8deg) scale(1.08);
        }

        .topnav {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        /* ─────────────────────────────────────────
           BUTTONS
        ───────────────────────────────────────── */

        .btn {
            position: relative;

            border: 1px solid var(--line);
            background: #0e1622;

            padding: 10px 17px;
            border-radius: 999px;

            font-weight: 620;

            overflow: hidden;

            transition:
                transform .22s cubic-bezier(.2, .8, .2, 1),
                border-color .22s ease,
                background .22s ease,
                box-shadow .22s ease;
        }

        .btn::before {
            content: "";

            position: absolute;
            inset: 0;

            opacity: 0;

            background:
                linear-gradient(
                    120deg,
                    transparent 20%,
                    #ffffff14 50%,
                    transparent 80%
                );

            transform: translateX(-100%);

            transition: opacity .2s ease;
        }

        .btn:hover::before {
            opacity: 1;
            transform: translateX(100%);
            transition: transform .65s ease;
        }

        .btn:hover,
        .btn:focus-visible {
            transform: translateY(-2px) scale(1.015);

            border-color: #4c8dff99;
            background: #111d2d;

            box-shadow: 0 8px 24px #0004;

            outline: none;
        }

        .btn:active {
            transform: scale(.96);
        }

        .btn.primary {
            border-color: transparent;

            background:
                linear-gradient(105deg, #4384fa, #62b9ff);

            color: #06101c;

            box-shadow: 0 8px 28px #367bf633;
        }

        .btn.primary:hover {
            box-shadow:
                0 12px 35px #367bf655,
                0 0 20px #65b8ff22;
        }

        .btn.ghost {
            background: transparent;
        }

        .btn.small {
            padding: 8px 13px;
            font-size: 13px;
        }

        /* ─────────────────────────────────────────
           HOME PAGE
        ───────────────────────────────────────── */

        .hero {
            min-height: 620px;

            padding: 100px 0 78px;

            display: grid;
            grid-template-columns: 1.05fr .95fr;
            align-items: center;
            gap: 56px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            color: #a8caff;

            font-size: 12px;
            letter-spacing: .12em;
            text-transform: uppercase;

            border: 1px solid #31538166;
            background: #0b1524;

            border-radius: 999px;
            padding: 7px 12px;

            animation: fadeUp .5s ease both;
        }

        .dot {
            width: 7px;
            height: 7px;

            background: var(--electric);
            border-radius: 50%;

            box-shadow: 0 0 12px var(--electric);
        }

        h1 {
            font-size: clamp(44px, 6.3vw, 75px);
            line-height: 1.02;

            letter-spacing: -.065em;

            margin: 25px 0 20px;
            max-width: 690px;
        }

        .gradient {
            background:
                linear-gradient(100deg, #f6f8ff 15%, #82bdff 85%);

            color: transparent;
            background-clip: text;
            -webkit-background-clip: text;
        }

        .lead {
            max-width: 540px;

            color: var(--muted);

            font-size: 17px;
            line-height: 1.75;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;

            margin-top: 30px;
        }

        .tiny {
            margin-top: 17px;

            font-size: 12px;
            color: var(--muted);
        }

        /* ─────────────────────────────────────────
           PORTFOLIO PREVIEW
        ───────────────────────────────────────── */

        .preview {
            position: relative;

            padding: 19px;

            border: 1px solid #8ebdff21;

            background:
                linear-gradient(145deg, #111c2b, #0a1019);

            border-radius: 24px;

            box-shadow:
                0 35px 100px #0008,
                0 0 80px #367bf617;

            animation:
                fadeUp .7s ease both,
                float 6s ease-in-out 1s infinite;
        }

        .preview::before {
            content: "";

            position: absolute;
            inset: -1px;

            border-radius: inherit;

            background:
                linear-gradient(
                    125deg,
                    #65b8ff33,
                    transparent 40%
                );

            pointer-events: none;
        }

        .prev-head {
            display: flex;
            align-items: center;
            gap: 13px;

            padding: 7px 4px 20px;
        }

        .avatar {
            width: 48px;
            height: 48px;

            display: grid;
            place-items: center;

            border-radius: 50%;

            background:
                linear-gradient(145deg, #365b8e, #182c47);

            color: #c7ddff;
            font-weight: 700;
        }

        .prev-head strong {
            display: block;
        }

        .prev-head small,
        .muted {
            color: var(--muted);
        }

        .tag {
            display: inline-block;

            margin: 3px 3px 3px 0;
            padding: 4px 9px;

            border: 1px solid #243248;
            background: #101a28;

            border-radius: 999px;

            color: #b9c8dd;
            font-size: 11px;
        }

        .preview h3 {
            margin: 13px 0 8px;
            font-size: 14px;
        }

        .preview p {
            margin: 0;

            color: var(--muted);
            font-size: 12px;
        }

        .prev-card {
            margin-top: 11px;
            padding: 14px;

            border: 1px solid #ffffff10;
            background: #0a111b;

            border-radius: 14px;

            transition:
                transform .25s ease,
                border-color .25s ease;
        }

        .prev-card:hover {
            transform: translateX(4px);
            border-color: #4c8dff55;
        }

        /* ─────────────────────────────────────────
           SECTIONS
        ───────────────────────────────────────── */

        .features {
            padding: 45px 0 85px;
        }

        .section-title {
            margin-bottom: 30px;
            text-align: center;
        }

        .section-title h2 {
            margin: 0 0 8px;

            font-size: 32px;
            letter-spacing: -.04em;
        }

        .section-title p {
            margin: 0;
            color: var(--muted);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        .feature,
        .card {
            background:
                linear-gradient(145deg, #0e1622, #0a1018);

            border: 1px solid #ffffff11;
            border-radius: 17px;

            padding: 20px;

            transition:
                transform .3s cubic-bezier(.2, .8, .2, 1),
                border-color .3s ease,
                box-shadow .3s ease;
        }

        .feature:hover {
            transform: translateY(-5px);

            border-color: #4c8dff44;

            box-shadow:
                0 20px 50px #0004,
                0 0 25px #367bf611;
        }

        .icon {
            width: 36px;
            height: 36px;

            display: grid;
            place-items: center;

            border-radius: 11px;

            color: #8ac5ff;
            background: #172941;

            font-size: 18px;
        }

        .feature h3 {
            margin: 16px 0 7px;
            font-size: 15px;
        }

        .feature p {
            margin: 0;

            color: var(--muted);
            font-size: 13px;
        }

        .steps {
            padding: 20px 0 85px;
        }

        .step-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        .step-no {
            color: #7fb9ff;

            font-size: 12px;
            letter-spacing: .12em;
        }

        .step-grid h3 {
            margin: 12px 0 6px;
        }

        /* ─────────────────────────────────────────
           FOOTER
        ───────────────────────────────────────── */

        .footer {
            padding: 25px 0;

            border-top: 1px solid #ffffff10;

            color: var(--muted);
            font-size: 12px;

            text-align: center;
        }

        /* ─────────────────────────────────────────
           APP LAYOUT
        ───────────────────────────────────────── */

        .app-layout {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 30px;

            padding: 32px 0 70px;
        }

        .side {
            padding-right: 17px;
            border-right: 1px solid #ffffff10;
        }

        .side button {
            width: 100%;

            margin: 3px 0;
            padding: 11px 13px;

            text-align: left;

            border: 0;
            background: transparent;

            border-radius: 10px;

            color: var(--muted);

            transition:
                background .2s ease,
                color .2s ease,
                transform .2s ease;
        }

        .side button:hover {
            transform: translateX(3px);
            background: #101a29;
            color: var(--text);
        }

        .side button.active {
            background:
                linear-gradient(90deg, #152943, #111c2b);

            color: var(--text);

            box-shadow: inset 2px 0 var(--blue);
        }

        .side .group {
            padding: 17px 13px 5px;

            color: #65758b;

            font-size: 10px;
            letter-spacing: .13em;
            text-transform: uppercase;
        }

        .main {
            min-width: 0;
        }

        .welcome {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 15px;

            margin-bottom: 25px;
        }

        .welcome h1 {
            margin: 0 0 5px;

            font-size: 34px;
        }

        /* ─────────────────────────────────────────
           DASHBOARD
        ───────────────────────────────────────── */

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 13px;

            margin: 20px 0;
        }

        .stat {
            transition:
                transform .25s ease,
                border-color .25s ease;
        }

        .stat:hover {
            transform: translateY(-3px);
            border-color: #4c8dff44;
        }

        .stat strong {
            display: block;

            margin-top: 9px;

            font-size: 26px;
        }

        .stat span {
            color: var(--muted);
            font-size: 13px;
        }

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;

            margin: 27px 0 14px;
        }

        .section-head h2 {
            margin: 0;
            font-size: 19px;
        }

        .list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .item {
            position: relative;
        }

        .item h3 {
            margin: 0 0 5px;
            font-size: 15px;
        }

        .item p {
            margin: 5px 0;

            color: var(--muted);
            font-size: 13px;
        }

        .item-actions {
            display: flex;
            gap: 7px;

            margin-top: 14px;
        }

        .empty {
            padding: 34px 20px;

            border: 1px dashed #293a50;
            border-radius: 16px;

            text-align: center;

            color: var(--muted);
        }

        .empty b {
            display: block;

            margin-bottom: 6px;

            color: var(--text);
        }

        /* ─────────────────────────────────────────
           FORMS
        ───────────────────────────────────────── */

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field label {
            color: #b7c5d8;
            font-size: 12px;
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;

            padding: 10px 12px;

            border: 1px solid #26364b;
            background: #080e16;

            border-radius: 10px;

            color: var(--text);

            outline: none;

            transition:
                border-color .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }

        .field input:hover,
        .field textarea:hover,
        .field select:hover {
            border-color: #39516e;
        }

        .field input:focus,
        .field textarea:focus,
        .field select:focus {
            border-color: var(--blue);

            box-shadow: 0 0 0 3px #4c8dff16;
            background: #0a111b;
        }

        .field textarea {
            min-height: 88px;
            resize: vertical;
        }

        /* ─────────────────────────────────────────
           PHOTO UPLOAD
        ───────────────────────────────────────── */

        .upload-box {
            position: relative;

            padding: 25px;

            border: 1px dashed #385575;
            background: #09111c;

            border-radius: 14px;

            text-align: center;

            color: var(--muted);

            cursor: pointer;

            transition:
                border-color .25s ease,
                background .25s ease,
                transform .25s ease;
        }

        .upload-box:hover {
            transform: translateY(-2px);

            border-color: var(--electric);
            background: #0c1726;
        }

        .upload-box strong {
            display: block;

            margin-bottom: 4px;

            color: var(--text);
        }

        .upload-box input {
            display: none;
        }

        .photo-preview {
            display: none;

            width: 100%;
            max-height: 250px;

            margin-top: 12px;

            object-fit: contain;

            border: 1px solid var(--line);
            border-radius: 12px;

            background: #05080d;
        }

        /* ─────────────────────────────────────────
           MODALS
        ───────────────────────────────────────── */

        .modal-back {
            position: fixed;
            inset: 0;

            z-index: 100;

            display: grid;
            place-items: center;

            padding: 18px;

            background: #02050bdf;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .modal {
            width: min(620px, 100%);
            max-height: 92vh;

            overflow: auto;

            padding: 23px;

            border: 1px solid #26364b;
            background:
                linear-gradient(145deg, #0d1622, #080e16);

            border-radius: 22px;

            box-shadow:
                0 25px 90px #000b,
                0 0 50px #367bf611;

            animation: modalIn .35s cubic-bezier(.2, .8, .2, 1);
        }

        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }

        .modal-head h2 {
            margin: 0;
            font-size: 20px;
        }

        .close {
            width: 34px;
            height: 34px;

            border: 1px solid transparent;
            background: transparent;

            border-radius: 50%;

            color: var(--muted);
            font-size: 23px;

            transition: all .2s ease;
        }

        .close:hover {
            background: #182433;
            border-color: var(--line);
            color: white;
            transform: rotate(90deg);
        }

        /* ─────────────────────────────────────────
           NOTIFICATIONS
        ───────────────────────────────────────── */

        .toast {
            position: fixed;
            right: 20px;
            bottom: 20px;

            z-index: 200;

            padding: 12px 17px;

            border: 1px solid #31517a;
            background: #132238;

            border-radius: 13px;

            box-shadow: 0 15px 45px #0008;

            animation: fadeUp .35s ease;
        }

        .hidden {
            display: none !important;
        }

        .pill {
            padding: 5px 10px;

            border: 1px solid #29405c;
            border-radius: 99px;

            color: #a9caff;
            font-size: 11px;
        }

        .progress {
            height: 5px;

            overflow: hidden;

            background: #172338;

            border-radius: 10px;
        }

        .progress i {
            display: block;

            height: 100%;
            width: 0;

            background:
                linear-gradient(90deg, var(--blue), var(--electric));

            border-radius: inherit;

            transition: width .6s cubic-bezier(.2, .8, .2, 1);
        }

        /* ─────────────────────────────────────────
           ABOUT PROJECT
        ───────────────────────────────────────── */

        .about-hero {
            max-width: 780px;

            padding: 90px 0 100px;
        }

        .about-hero h1 {
            margin-bottom: 18px;
        }

        .about-card {
            margin-top: 35px;

            padding: 28px;

            border: 1px solid #ffffff12;

            background:
                linear-gradient(145deg, #0e1826, #090f18);

            border-radius: 22px;

            box-shadow: 0 25px 70px #0004;
        }

        .about-card h2 {
            margin-top: 0;
        }

        .about-textarea {
            width: 100%;
            min-height: 250px;

            padding: 18px;

            border: 1px solid #26364b;
            background: #070c13;

            border-radius: 14px;

            color: var(--text);

            resize: vertical;

            outline: none;

            line-height: 1.7;

            transition:
                border-color .2s ease,
                box-shadow .2s ease;
        }

        .about-textarea:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 4px #4c8dff14;
        }

        .mobile-nav {
            display: none;
        }

        /* ─────────────────────────────────────────
           MOBILE
        ───────────────────────────────────────── */

        @media (max-width: 850px) {

            .hero {
                grid-template-columns: 1fr;
                gap: 38px;

                padding: 70px 0;
            }

            .preview {
                max-width: 560px;
            }

            .grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .app-layout {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .side {
                display: none;
            }

            .mobile-nav {
                display: flex;

                overflow: auto;
                gap: 7px;

                padding: 12px 0;

                border-bottom: 1px solid #ffffff12;
            }

            .mobile-nav button {
                white-space: nowrap;

                padding: 8px 12px;

                border: 1px solid var(--line);
                background: #0b121d;

                border-radius: 99px;

                color: var(--muted);
                font-size: 12px;
            }

            .mobile-nav button.active {
                border-color: var(--blue);
                color: white;
            }

        }

        @media (max-width: 560px) {

            .shell {
                padding: 0 17px;
            }

            .top {
                height: 64px;
            }

            .topnav .ghost {
                display: none;
            }

            .hero {
                padding: 58px 0;
            }

            .lead {
                font-size: 15px;
            }

            .grid,
            .step-grid,
            .list {
                grid-template-columns: 1fr;
            }

            .stat-grid {
                gap: 7px;
            }

            .stat {
                padding: 14px;
            }

            .stat strong {
                font-size: 21px;
            }

            .stat span {
                font-size: 11px;
            }

            .welcome {
                flex-direction: column;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }

        }

    </style>
</head>

<body>

    <div id="root"></div>

    <script>

        (() => {

            "use strict";

            const $ = selector => document.querySelector(selector);

            const esc = value =>
                String(value ?? "").replace(/[&<>"']/g, character => ({
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                }[character]));

            /*
             * Certificate categories.
             * Kept as a useful list for organizing certificates.
             */

                                    id="p-skills"
                                    value="${esc(
                                        (p.skills || []).join(", ")
                                    )}"
                                >

                            </div>

                            <div class="field">

                                <label for="p-interests">
                                    Interests (comma separated)
                                </label>

                                <input
                                    id="p-interests"
                                    value="${esc(
                                        (p.interests || []).join(", ")
                                    )}"
                                >

                            </div>

                        </div>

                        <div
                            class="actions"
                            style="margin-top:20px"
                        >

                            <button
                                class="btn primary"
                                type="submit"
                            >
                                Save profile
                            </button>

                        </div>

                    </form>
                `;
            }

            /* ─────────────────────────────────────
               PORTFOLIO SETTINGS
            ───────────────────────────────────── */

            function portfolioSettings(view) {

                view.innerHTML = `

                    <div class="welcome">

                        <div>

                            <h1>
                                My Portfolio
                            </h1>

                            <span class="muted">
                                Control your public presence.
                            </span>

                        </div>

                    </div>

                    <div class="card">

                        <div
                            class="section-head"
                            style="margin-top:0"
                        >

                            <h2>
                                Publishing status
                            </h2>

                        </div>

                        <p>
                            Your portfolio is currently
                            <strong>
                                ${
                                    profile.portfolio_published
                                        ? "Published"
                                        : "Private"
                                }
                            </strong>.
                        </p>

                        <p
                            class="muted"
                            style="font-size:13px"
                        >
                            Only items you mark as public will be
                            included when your portfolio is published.
                        </p>

                        <div class="actions">

                            <button
                                class="btn ${
                                    profile.portfolio_published
                                        ? ""
                                        : "primary"
                                }"
                                data-action="toggle-publish"
                            >
                                ${
                                    profile.portfolio_published
                                        ? "Unpublish portfolio"
                                        : "Publish portfolio"
                                }
                            </button>

                        </div>

                    </div>
                `;
            }

            /* ─────────────────────────────────────
               ADD / EDIT ITEM MODAL
            ───────────────────────────────────── */

            function itemModal(type, id) {

                const config = configFor(type);

                const isEdit = Boolean(id);

                const item = isEdit
                    ? records[type].find(record =>
                        record.id === id
                    ) || {}
                    : {};

                const fieldsHtml =
                    config.fields.map(
                        ([key, label, type, required]) => {

                            if (type === "checkbox") {

                                return `
                                    <div
                                        class="field"
                                        style="
                                            flex-direction:row;
                                            align-items:center;
                                            gap:10px;
                                            margin-top:10px
                                        "
                                    >

                                        <input
                                            type="checkbox"
                                            id="f-${key}"
                                            ${
                                                item[key]
                                                    ? "checked"
                                                    : ""
                                            }
                                        >

                                        <label
                                            for="f-${key}"
                                            style="margin:0"
                                        >
                                            ${label}
                                        </label>

                                    </div>
                                `;
                            }

                            if (type === "select") {

                                return `
                                    <div class="field">

                                        <label for="f-${key}">
                                            ${label}
                                        </label>

                                        <select id="f-${key}">

                                            ${categories.map(category => `

                                                <option
                                                    value="${category}"
                                                    ${
                                                        item[key] === category
                                                            ? "selected"
                                                            : ""
                                                    }
                                                >
                                                    ${category}
                                                </option>

                                            `).join("")}

                                        </select>

                                    </div>
                                `;
                            }

                            if (type === "textarea") {

                                return `
                                    <div class="field full">

                                        <label for="f-${key}">
                                            ${label}
                                        </label>

                                        <textarea
                                            id="f-${key}"
                                            ${
                                                required
                                                    ? "required"
                                                    : ""
                                            }
                                        >${esc(item[key] || "")}</textarea>

                                    </div>
                                `;
                            }

                            return `
                                <div class="field">

                                    <label for="f-${key}">
                                        ${label}
                                    </label>

                                    <input
                                        type="${type}"
                                        id="f-${key}"
                                        value="${esc(item[key] || "")}"
                                        ${
                                            required
                                                ? "required"
                                                : ""
                                        }
                                    >

                                </div>
                            `;
                        }
                    ).join("");

                const photoSection =
                    type === "certificates"
                        ? `

                            <div class="field full">

                                <label>
                                    Certificate verification photo
                                </label>

                                <label
                                    class="upload-box"
                                    for="certificate-photo"
                                >

                                    <strong>
                                        Add a photo to verify
                                    </strong>

                                    Upload a photo or screenshot of
                                    your certificate.

                                    <input
                                        id="certificate-photo"
                                        type="file"
                                        accept="image/*"
                                    >

                                </label>

                                <img
                                    id="photo-preview"
                                    class="photo-preview"
                                    ${
                                        item.photo
                                            ? `
                                                src="${item.photo}"
                                                style="display:block"
                                            `
                                            : ""
                                    }
                                    alt="Certificate preview"
                                >

                            </div>

                        `
                        : "";

                return `

                    <div
                        class="modal-back"
                        id="modal"
                    >

                        <section
                            class="modal"
                            role="dialog"
                            aria-modal="true"
                        >

                            <div class="modal-head">

                                <h2>
                                    ${
                                        isEdit
                                            ? "Edit"
                                            : "Add"
                                    }
                                    ${config.title.toLowerCase()}
                                </h2>

                                <button
                                    class="close"
                                    data-action="close"
                                >
                                    ×
                                </button>

                            </div>

                            <form
                                id="item-form"
                                data-type="${type}"
                                data-id="${id || ""}"
                            >

                                <div class="form-grid">

                                    ${fieldsHtml}

                                    ${photoSection}

                                </div>

                                <div
                                    class="actions"
                                    style="margin-top:24px"
                                >

                                    <button
                                        class="btn primary"
                                        type="submit"
                                    >
                                        Save
                                    </button>

                                    <button
                                        class="btn"
                                        type="button"
                                        data-action="close"
                                    >
                                        Cancel
                                    </button>

                                </div>

                            </form>

                        </section>

                    </div>
                `;
            }

            /* ─────────────────────────────────────
               CLICK EVENTS
            ───────────────────────────────────── */

            document.addEventListener(
                "click",
                event => {

                    const button =
                        event.target.closest("button");

                    if (!button) return;

                    const action =
                        button.dataset.action;

                    const tabName =
                        button.dataset.tab;

                    const newType =
                        button.dataset.new;

                    const editType =
                        button.dataset.edit;

                    const deleteType =
                        button.dataset.delete;

                    if (tabName) {

                        tab = tabName;
                        renderView();

                        return;
                    }

                    if (action === "close") {

                        $("#modal")?.remove();

                        return;
                    }

                    if (action === "home") {

                        landing();

                        return;
                    }

                    if (action === "about") {

                        aboutPage();

                        return;
                    }

                    if (action === "save-about") {

                        aboutProject =
                            $("#about-text").value;

                        notify(
                            "About This Project saved!"
                        );

                        return;
                    }

                    if (action === "start") {

                        $("#modal")?.remove();

                        authModal("signup");

                        return;
                    }

                    if (action === "signin") {

                        $("#modal")?.remove();

                        authModal("login");

                        return;
                    }

                    if (action === "dashboard") {

                        if (!user) {
                            authModal("login");
                            return;
                        }

                        app();

                        return;
                    }

                    if (action === "signout") {

                        user = null;

                        landing();

                        notify("Signed out successfully");

                        return;
                    }

                    if (action === "new-certificate") {

                        document.body.insertAdjacentHTML(
                            "beforeend",
                            itemModal("certificates")
                        );

                        return;
                    }

                    if (newType) {

                        document.body.insertAdjacentHTML(
                            "beforeend",
                            itemModal(newType)
                        );

                        return;
                    }

                    if (editType) {

                        document.body.insertAdjacentHTML(
                            "beforeend",
                            itemModal(
                                editType,
                                button.dataset.id
                            )
                        );

                        return;
                    }

                    if (deleteType) {

                        if (
                            confirm(
                                "Are you sure you want to delete this item?"
                            )
                        ) {

                            records[deleteType] =
                                records[deleteType].filter(
                                    item =>
                                        item.id !==
                                        button.dataset.id
                                );

                            renderView();

                            notify("Item deleted");
                        }

                        return;
                    }

                    if (action === "toggle-publish") {

                        profile.portfolio_published =
                            !profile.portfolio_published;

                        renderView();

                        notify(
                            profile.portfolio_published
                                ? "Portfolio is now public"
                                : "Portfolio is now private"
                        );

                        return;
                    }

                    if (action === "demo") {

                        user = {
                            id: "demo-user",
                            email: "demo@example.com"
                        };

                        profile = {
                            full_name: "Demo User",
                            bio: "",
                            grade: "",
                            section: "",
                            school_name: "",
                            username: "demo-user",
                            skills: [],
                            interests: [],
                            portfolio_published: false
                        };

                        tab = "Overview";

                        app();

                        notify("Welcome to the demo!");

                        return;
                    }
                }
            );

            /* ─────────────────────────────────────
               PHOTO PREVIEW
            ───────────────────────────────────── */

            document.addEventListener(
                "change",
                event => {

                    if (
                        event.target.id !==
                        "certificate-photo"
                    ) return;

                    const file =
                        event.target.files[0];

                    if (!file) return;

                    const reader = new FileReader();

                    reader.onload = loadEvent => {

                        const preview =
                            $("#photo-preview");

                        preview.src =
                            loadEvent.target.result;

                        preview.style.display =
                            "block";
                    };

                    reader.readAsDataURL(file);
                }
            );

            /* ─────────────────────────────────────
               FORM SUBMISSIONS
            ───────────────────────────────────── */

            document.addEventListener(
                "submit",
                event => {

                    const form = event.target;

                    if (
                        form.id !== "auth-form" &&
                        form.id !== "item-form" &&
                        form.id !== "profile-form"
                    ) {
                        return;
                    }

                    event.preventDefault();

                    /* AUTH */

                    if (form.id === "auth-form") {

                        user = {
                            id: "local-user",
                            email: $("#email").value
                        };

                        profile.full_name =
                            $("#name")?.value ||
                            "Pathfolio User";

                        $("#modal")?.remove();

                        tab = "Overview";

                        app();

                        notify(
                            "Welcome to Pathfolio!"
                        );

                        return;
                    }

                    /* PROFILE */

                    if (form.id === "profile-form") {

                        [
                            "full_name",
                            "grade",
                            "section",
                            "school_name",
                            "username",
                            "bio"
                        ].forEach(key => {

                            const element =
                                $(`#p-${key}`);

                            if (element) {
                                profile[key] =
                                    element.value;
                            }
                        });

                        profile.skills =
                            $("#p-skills").value
                                .split(",")
                                .map(value =>
                                    value.trim()
                                )
                                .filter(Boolean);

                        profile.interests =
                            $("#p-interests").value
                                .split(",")
                                .map(value =>
                                    value.trim()
                                )
                                .filter(Boolean);

                        notify(
                            "Profile updated successfully"
                        );

                        return;
                    }

                    /* ITEMS */

                    if (form.id === "item-form") {

                        const type =
                            form.dataset.type;

                        const id =
                            form.dataset.id;

                        const config =
                            configFor(type);

                        const data = {

                            id:
                                id ||
                                Date.now().toString(),

                            _type: type,

                            created_at:
                                new Date().toISOString()
                        };

                        config.fields.forEach(
                            ([key, label, fieldType]) => {

                                const element =
                                    $(`#f-${key}`);

                                if (!element) return;

                                data[key] =
                                    fieldType === "checkbox"
                                        ? element.checked
                                        : element.value;
                            }
                        );

                        /* Save certificate photo */

                        if (
                            type === "certificates"
                        ) {

                            const preview =
                                $("#photo-preview");

                            if (
                                preview &&
                                preview.src &&
                                preview.src.startsWith(
                                    "data:image"
                                )
                            ) {

                                data.photo =
                                    preview.src;
                            }

                            /*
                             * Keep existing photo when editing
                             * without choosing a new one.
                             */

                            if (
                                id &&
                                !data.photo
                            ) {

                                const old =
                                    records[type].find(
                                        item =>
                                            item.id === id
                                    );

                                if (old?.photo) {
                                    data.photo =
                                        old.photo;
                                }
                            }
                        }

                        if (id) {

                            const index =
                                records[type].findIndex(
                                    item =>
                                        item.id === id
                                );

                            if (index > -1) {

                                records[type][index] = {
                                    ...records[type][index],
                                    ...data
                                };
                            }

                        } else {

                            records[type].push(data);
                        }

                        $("#modal")?.remove();

                        renderView();

                        notify(
                            `${config.title} saved successfully`
                        );
                    }
                }
            );

            /* ─────────────────────────────────────
               START THE APP
            ───────────────────────────────────── */

            landing();

        })();

    </script>

</body>
</html>
