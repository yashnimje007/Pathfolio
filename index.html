<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05070b">

<title>Pathfolio — Your achievements. Your future.</title>

<style>
:root{
    --bg:#05070b;
    --panel:#0d1420;
    --panel2:#080e16;
    --line:#223149;
    --text:#f5f7fb;
    --muted:#98a7ba;
    --blue:#4c8dff;
    --electric:#65b8ff;
    --accent:#4c8dff;
    --accent-rgb:76,141,255;
    font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
    margin:0;
    min-height:100vh;
    color:var(--text);
    overflow-x:hidden;
    background:
        radial-gradient(ellipse at 15% -10%,rgba(var(--accent-rgb),.18),transparent 42%),
        radial-gradient(ellipse at 90% 10%,rgba(80,110,255,.12),transparent 35%),
        var(--bg);
    transition:background .45s ease;
}

button,input,textarea,select{font:inherit}
button{color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}

.hidden{display:none!important}

.shell{
    width:min(1200px,calc(100% - 40px));
    margin:auto;
}

/* ── Animations ── */

@keyframes fadeUp{
    from{opacity:0;transform:translateY(18px)}
    to{opacity:1;transform:translateY(0)}
}

@keyframes float{
    0%,100%{transform:translateY(0) rotate(1deg)}
    50%{transform:translateY(-8px) rotate(1deg)}
}

@keyframes glowPulse{
    0%,100%{box-shadow:0 0 20px rgba(var(--accent-rgb),.12)}
    50%{box-shadow:0 0 42px rgba(var(--accent-rgb),.28)}
}

@keyframes strip{
    from{transform:translateX(-140%)}
    to{transform:translateX(140%)}
}

@keyframes messageIn{
    from{opacity:0;transform:translateY(8px) scale(.98)}
    to{opacity:1;transform:translateY(0) scale(1)}
}

.animate-in{animation:fadeUp .55s cubic-bezier(.2,.8,.2,1) both}

/* ── Top bar ── */

.top{
    height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #ffffff0d;
    backdrop-filter:blur(18px);
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
    border:0;
    background:transparent;
    font-size:19px;
    font-weight:750;
    letter-spacing:-.04em;
}

.logo{
    width:33px;
    height:33px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:linear-gradient(145deg,var(--electric),var(--accent));
    color:#06101f;
    font-weight:900;
    box-shadow:0 0 28px rgba(var(--accent-rgb),.35);
    transition:transform .3s ease;
}

.brand:hover .logo{transform:rotate(-8deg) scale(1.08)}

.topnav{display:flex;gap:9px;align-items:center}

/* ── Buttons ── */

.btn{
    position:relative;
    overflow:hidden;
    padding:10px 17px;
    border:1px solid var(--line);
    border-radius:999px;
    background:#0d1622;
    font-weight:650;
    transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}

.btn::after,
.spaceship-hover::after{
    content:"";
    position:absolute;
    inset:0;
    width:45%;
    background:linear-gradient(90deg,transparent,rgba(var(--accent-rgb),.75),transparent);
    opacity:0;
    pointer-events:none;
}

.btn:hover::after,
.spaceship-hover:hover::after{
    opacity:1;
    animation:strip .7s ease;
}

.btn:hover{
    transform:translateY(-2px);
    border-color:rgba(var(--accent-rgb),.7);
    box-shadow:0 10px 28px rgba(0,0,0,.3);
}

.btn:active{transform:scale(.97)}

.btn.primary{
    border-color:transparent;
    color:#06101c;
    background:linear-gradient(105deg,var(--accent),var(--electric));
    box-shadow:0 8px 28px rgba(var(--accent-rgb),.22);
}

.btn.ghost{background:transparent}
.btn.small{padding:8px 13px;font-size:13px}

/* ── Landing ── */

.hero{
    min-height:620px;
    padding:95px 0 75px;
    display:grid;
    grid-template-columns:1.05fr .95fr;
    align-items:center;
    gap:56px;
}

.eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:7px 12px;
    border:1px solid rgba(var(--accent-rgb),.3);
    border-radius:999px;
    background:#0b1524;
    color:#a8caff;
    font-size:12px;
    letter-spacing:.11em;
    text-transform:uppercase;
}

.dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--electric);
    box-shadow:0 0 12px var(--electric);
}

h1{
    font-size:clamp(43px,6vw,74px);
    line-height:1.03;
    letter-spacing:-.065em;
    margin:25px 0 20px;
}

.gradient{
    color:transparent;
    background:linear-gradient(100deg,#f6f8ff 10%,var(--electric));
    background-clip:text;
    -webkit-background-clip:text;
}

.lead{
    max-width:560px;
    color:var(--muted);
    font-size:17px;
    line-height:1.75;
}

.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}

.preview{
    position:relative;
    padding:20px;
    border:1px solid rgba(var(--accent-rgb),.18);
    border-radius:24px;
    background:linear-gradient(145deg,#111c2b,#090f18);
    box-shadow:0 35px 100px #0009,0 0 70px rgba(var(--accent-rgb),.09);
    animation:fadeUp .7s ease both,float 6s ease-in-out 1s infinite;
}

.prev-head{display:flex;align-items:center;gap:13px;padding:7px 4px 20px}

.avatar{
    width:49px;height:49px;
    display:grid;place-items:center;
    border-radius:50%;
    background:linear-gradient(145deg,#365b8e,#182c47);
    color:#c7ddff;font-weight:800;
}

.muted,.prev-head small{color:var(--muted)}

.pill{
    padding:5px 10px;
    border:1px solid rgba(var(--accent-rgb),.35);
    border-radius:99px;
    color:#a9caff;
    font-size:11px;
}

.tag{
    display:inline-block;
    margin:3px 3px 3px 0;
    padding:4px 9px;
    border:1px solid #26364b;
    border-radius:999px;
    background:#101a28;
    color:#b9c8dd;
    font-size:11px;
}

.prev-card,.card{
    border:1px solid #ffffff12;
    border-radius:17px;
    background:linear-gradient(145deg,#0e1622,#090f18);
}

.prev-card{
    margin-top:11px;
    padding:14px;
    transition:transform .25s ease,border-color .25s ease;
}

.prev-card:hover{
    transform:translateX(5px);
    border-color:rgba(var(--accent-rgb),.5);
}

/* ── Sections ── */

.features,.steps{padding:45px 0 85px}
.section-title{text-align:center;margin-bottom:30px}
.section-title h2{font-size:32px;letter-spacing:-.04em;margin:0 0 8px}
.section-title p{margin:0;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.step-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

.feature{
    padding:20px;
    border:1px solid #ffffff11;
    border-radius:17px;
    background:linear-gradient(145deg,#0e1622,#090f18);
    transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease;
}

.feature:hover{
    transform:translateY(-5px);
    border-color:rgba(var(--accent-rgb),.4);
    box-shadow:0 20px 50px #0004;
}

.icon{
    width:37px;height:37px;
    display:grid;place-items:center;
    border-radius:11px;
    background:rgba(var(--accent-rgb),.14);
    color:var(--electric);
}

.feature h3{margin:16px 0 7px;font-size:15px}
.feature p{margin:0;color:var(--muted);font-size:13px}

.footer{
    padding:25px 0;
    border-top:1px solid #ffffff10;
    text-align:center;
    color:var(--muted);
    font-size:12px;
}

/* ── App layout ── */

.app-layout{
    display:grid;
    grid-template-columns:220px 1fr;
    gap:30px;
    padding:32px 0 70px;
}

.side{
    padding-right:17px;
    border-right:1px solid #ffffff10;
}

.side button{
    position:relative;
    width:100%;
    margin:3px 0;
    padding:11px 13px;
    overflow:hidden;
    text-align:left;
    border:0;
    border-radius:10px;
    background:transparent;
    color:var(--muted);
    transition:background .2s,color .2s,transform .2s;
}

.side button:hover{
    transform:translateX(3px);
    background:#101a29;
    color:var(--text);
}

.side button.active{
    color:white;
    background:linear-gradient(90deg,rgba(var(--accent-rgb),.2),#111c2b);
    box-shadow:inset 2px 0 var(--accent);
}

.group{
    padding:17px 13px 5px;
    color:#65758b;
    font-size:10px;
    letter-spacing:.13em;
    text-transform:uppercase;
}

.welcome{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
    margin-bottom:25px;
}

.welcome h1{margin:0 0 5px;font-size:34px}
.main{min-width:0}

.stat-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:13px;
    margin:20px 0;
}

.card{padding:20px}
.stat strong{display:block;margin-top:9px;font-size:27px}
.stat span{color:var(--muted);font-size:13px}

.list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin:27px 0 14px;
}

.section-head h2{margin:0;font-size:19px}

.empty{
    padding:34px 20px;
    border:1px dashed #293a50;
    border-radius:16px;
    text-align:center;
    color:var(--muted);
}

.empty b{display:block;color:var(--text);margin-bottom:6px}

/* ── Forms ── */

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:#b7c5d8}

.field input,.field textarea,.field select{
    width:100%;
    padding:10px 12px;
    border:1px solid #26364b;
    border-radius:10px;
    outline:none;
    background:#080e16;
    color:var(--text);
}

.field input:focus,.field textarea:focus,.field select:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(var(--accent-rgb),.12);
}

.field textarea{min-height:90px;resize:vertical}

.upload-box{
    padding:22px;
    border:1px dashed #385575;
    border-radius:14px;
    background:#09111c;
    text-align:center;
    color:var(--muted);
    cursor:pointer;
}

.upload-box strong{display:block;color:white;margin-bottom:4px}
.upload-box input{display:none}

.photo-preview{
    display:none;
    width:100%;
    max-height:250px;
    margin-top:12px;
    object-fit:contain;
    border-radius:12px;
    border:1px solid var(--line);
}

/* ── Modal / toast ── */

.modal-back{
    position:fixed;inset:0;z-index:100;
    display:grid;place-items:center;
    padding:18px;
    background:#02050be6;
    backdrop-filter:blur(10px);
}

.modal{
    width:min(620px,100%);
    max-height:92vh;
    overflow:auto;
    padding:23px;
    border:1px solid #26364b;
    border-radius:22px;
    background:linear-gradient(145deg,#0d1622,#080e16);
    box-shadow:0 25px 90px #000b;
    animation:fadeUp .3s ease;
}

.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-head h2{margin:0;font-size:20px}

.close{
    width:35px;height:35px;
    border:0;border-radius:50%;
    background:transparent;color:var(--muted);
    font-size:23px;
}

.close:hover{background:#182433;color:white}

.toast{
    position:fixed;right:20px;bottom:20px;z-index:300;
    padding:12px 17px;
    border:1px solid rgba(var(--accent-rgb),.5);
    border-radius:13px;
    background:#132238;
    box-shadow:0 15px 45px #0008;
    animation:fadeUp .35s ease;
}

/* ── About page ── */

.about-hero{padding:70px 0 45px;text-align:center}
.about-hero h1{font-size:clamp(40px,5vw,64px)}

.bot-wrap{
    width:min(850px,100%);
    margin:35px auto 70px;
    text-align:left;
    border:1px solid rgba(var(--accent-rgb),.24);
    border-radius:25px;
    overflow:hidden;
    background:linear-gradient(145deg,#0d1725,#070c13);
    box-shadow:0 30px 100px #0008,0 0 80px rgba(var(--accent-rgb),.08);
}

.bot-header{
    display:flex;
    align-items:center;
    gap:13px;
    padding:17px 20px;
    border-bottom:1px solid #ffffff0d;
}

.bot-orb{
    width:40px;height:40px;border-radius:13px;
    display:grid;place-items:center;
    background:linear-gradient(145deg,var(--electric),var(--accent));
    color:#06101c;
    box-shadow:0 0 25px rgba(var(--accent-rgb),.4);
}

.bot-header strong{display:block}
.bot-header small{color:var(--muted)}

.chat-messages{
    height:350px;
    overflow:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.message{
    max-width:78%;
    padding:11px 14px;
    border-radius:15px;
    animation:messageIn .3s ease;
}

.message.bot{
    align-self:flex-start;
    background:#111c2b;
    border:1px solid #ffffff0d;
}

.message.user{
    align-self:flex-end;
    background:rgba(var(--accent-rgb),.18);
    border:1px solid rgba(var(--accent-rgb),.3);
}

.chat-input{
    display:flex;
    gap:10px;
    padding:15px;
    border-top:1px solid #ffffff0d;
}

.chat-input input{
    flex:1;
    min-width:0;
    padding:12px 14px;
    border:1px solid #26364b;
    border-radius:12px;
    outline:none;
    background:#080e16;
    color:white;
}

.about-showcase{padding:20px 0 90px}

.showcase-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:22px;
}

.feature-preview{
    min-height:360px;
    padding:25px;
    position:relative;
    overflow:hidden;
}

.feature-preview h3{font-size:22px;margin:0 0 8px}
.feature-preview>p{color:var(--muted);max-width:430px}

/* Mini customization mockup */

.mini-app{
    margin-top:25px;
    display:grid;
    grid-template-columns:120px 1fr;
    min-height:180px;
    border:1px solid #ffffff12;
    border-radius:15px;
    overflow:hidden;
    background:#080e16;
}

.mini-side{
    padding:12px 8px;
    border-right:1px solid #ffffff0d;
}

.mini-tab{
    position:relative;
    overflow:hidden;
    margin:4px 0;
    padding:8px;
    border-radius:7px;
    color:#7f8da0;
    font-size:11px;
}

.mini-tab.personalize{
    color:white;
    background:rgba(var(--accent-rgb),.15);
    cursor:default;
}

.mini-tab.personalize::after{
    content:"";
    position:absolute;
    top:0;bottom:0;
    left:-45%;
    width:38%;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
    filter:blur(2px);
    opacity:.8;
    transition:left .6s ease;
}

.feature-preview:hover .mini-tab.personalize::after{left:115%}

.mini-content{padding:16px}

.color-dots{display:flex;gap:9px;margin-top:13px}
.color-dot{width:27px;height:27px;border-radius:50%;border:2px solid #ffffff22}
.color-dot.one{background:#4c8dff}
.color-dot.two{background:#8c7dff}
.color-dot.three{background:#72ddb1}
.color-dot.four{background:#ff858e}

.mini-profile{
    display:flex;gap:10px;align-items:center;
    margin-top:15px;
    padding:10px;
    border:1px solid #ffffff0d;
    border-radius:10px;
}

.mini-avatar{
    width:35px;height:35px;border-radius:50%;
    background:linear-gradient(145deg,#365b8e,#182c47);
}

.mini-lines{flex:1}
.mini-lines i{display:block;height:6px;margin:5px 0;border-radius:99px;background:#243248}
.mini-lines i:first-child{width:70%}

/* Achievement mockup */

.mini-certificate{
    margin:30px auto 0;
    max-width:400px;
    padding:20px;
    border:1px solid rgba(var(--accent-rgb),.3);
    border-radius:16px;
    background:linear-gradient(145deg,#111c2b,#080e16);
    transform:rotate(-2deg);
    transition:transform .4s ease;
}

.feature-preview:hover .mini-certificate{transform:rotate(0) translateY(-4px)}
.mini-certificate .certificate-mark{
    width:38px;height:38px;
    display:grid;place-items:center;
    border-radius:12px;
    background:rgba(var(--accent-rgb),.15);
    color:var(--electric);
}

.progress{
    height:5px;
    overflow:hidden;
    border-radius:10px;
    background:#172338;
}

.progress i{
    display:block;height:100%;
    background:linear-gradient(90deg,var(--accent),var(--electric));
}

.mobile-nav{display:none}

/* ── Responsive ── */

@media(max-width:850px){
    .hero{grid-template-columns:1fr;gap:38px;padding:70px 0}
    .grid{grid-template-columns:repeat(2,1fr)}
    .app-layout{grid-template-columns:1fr;gap:14px}
    .side{display:none}
    .mobile-nav{display:flex;gap:7px;overflow:auto;padding:12px 0;border-bottom:1px solid #ffffff12}
    .mobile-nav button{
        white-space:nowrap;padding:8px 12px;
        border:1px solid var(--line);border-radius:99px;
        background:#0b121d;color:var(--muted);
    }
    .mobile-nav button.active{border-color:var(--accent);color:white}
}

@media(max-width:600px){
    .shell{width:min(100% - 28px,1200px)}
    .top{height:65px}
    .topnav .ghost{display:none}
    .grid,.step-grid,.list,.showcase-grid{grid-template-columns:1fr}
    .form-grid{grid-template-columns:1fr}
    .field.full{grid-column:auto}
    .stat-grid{gap:7px}
    .stat{padding:14px}
    .stat strong{font-size:21px}
    .welcome{flex-direction:column}
    .mini-app{grid-template-columns:95px 1fr}
    .chat-messages{height:330px}
}

@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{
        animation:none!important;
        transition:none!important;
        scroll-behavior:auto!important;
    }
}
</style>
</head>

<body>
<div id="root"></div>

<script>
(() => {
"use strict";

const $ = s => document.querySelector(s);

const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

const categories = [
    "Academic","Technology","Science","Arts",
    "Sports","Leadership","Volunteering",
    "Competitions","Other"
];

/* ── App data ── */

let user = null;
let tab = "Overview";

let profile = {
    full_name:"",
    email:"",
    bio:"",
    grade:"",
    school_name:"",
    username:"",
    skills:[],
    interests:[],
    photo:"",
    portfolio_published:false
};

let records = {
    certificates:[],
    achievements:[],
    projects:[]
};

let settings = {
    accent:"#4c8dff",
    background:"#05070b",
    theme:"Classic Black & Blue"
};

/* ── Local storage ── */

function saveData(){
    localStorage.setItem("pathfolio-user",JSON.stringify(user));
    localStorage.setItem("pathfolio-profile",JSON.stringify(profile));
    localStorage.setItem("pathfolio-records",JSON.stringify(records));
    localStorage.setItem("pathfolio-settings",JSON.stringify(settings));
}

function loadData(){
    try{
        user = JSON.parse(localStorage.getItem("pathfolio-user")) || null;
        profile = {...profile,...(JSON.parse(localStorage.getItem("pathfolio-profile")) || {})};
        records = {...records,...(JSON.parse(localStorage.getItem("pathfolio-records")) || {})};
        settings = {...settings,...(JSON.parse(localStorage.getItem("pathfolio-settings")) || {})};
    }catch(error){
        console.log("Pathfolio data could not be loaded.");
    }
    applyTheme();
}

function hexToRgb(hex){
    const value = hex.replace("#","");
    const number = parseInt(value.length === 3
        ? value.split("").map(x=>x+x).join("")
        : value,16);
    return `${(number>>16)&255},${(number>>8)&255},${number&255}`;
}

function applyTheme(){
    document.documentElement.style.setProperty("--accent",settings.accent);
    document.documentElement.style.setProperty("--accent-rgb",hexToRgb(settings.accent));
    document.documentElement.style.setProperty("--bg",settings.background);
    document.querySelector('meta[name="theme-color"]')
        ?.setAttribute("content",settings.background);
}

/* ── Notification ── */

let toastTimer;
function notify(message){
    $(".toast")?.remove();
    const toast=document.createElement("div");
    toast.className="toast";
    toast.textContent=message;
    document.body.append(toast);
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toast.remove(),3000);
}

/* ── Navigation ── */

function topbar(){
    return `
    <header class="top shell">
        <button class="brand" data-action="home" aria-label="Pathfolio home">
            <span class="logo">P</span>
            <span>Pathfolio</span>
        </button>
        <nav class="topnav" id="topnav"></nav>
    </header>`;
}

function renderTopnav(){
    const nav=$("#topnav");
    if(!nav)return;

    nav.innerHTML=user ? `
        <button class="btn ghost small" data-action="about">About This Project</button>

function setupChatbot(){
    $("#chat-form")?.addEventListener("submit",event=>{
        event.preventDefault();
        const input=$("#chat-input");
        const question=input.value.trim();
        if(!question)return;

        addMessage(question,"user");
        input.value="";

        setTimeout(()=>addMessage(getBotAnswer(question),"bot"),350);
    });
}

function addMessage(text,type){
    const messages=$("#chat-messages");
    if(!messages)return;

    const message=document.createElement("div");
    message.className=`message ${type}`;
    message.textContent=text;
    messages.append(message);
    messages.scrollTop=messages.scrollHeight;
}

function getBotAnswer(question){
    const q=question.toLowerCase();

    if(q.includes("what is pathfolio") || q.includes("what does pathfolio do")){
        return "Pathfolio is a personal portfolio app designed to help you organize certificates, achievements and projects in one place. The goal is to make your progress easier to understand, celebrate and eventually share.";
    }

    if(q.includes("certificate")){
        return "You can add certificates with details such as the title, organization, category and date. Pathfolio also lets you attach a photo or screenshot as verification.";
    }

    if(q.includes("personal") || q.includes("color") || q.includes("custom")){
        return "Pathfolio includes an App Personalization area where you can change your profile picture, interface accent color and background color. You can always return to the classic black-and-blue look too.";
    }

    if(q.includes("project")){
        return "The Projects section lets you record things you have created, describe them, list technologies or skills used and add a project link when you have one.";
    }

    if(q.includes("achievement") || q.includes("award")){
        return "Achievements can include awards, competitions, leadership experiences, volunteering and other milestones that are important to your story.";
    }

    if(q.includes("portfolio") || q.includes("public") || q.includes("share")){
        return "Your portfolio can be kept private while you build it. You can choose which items are public and later publish your portfolio when you're ready.";
    }

    if(q.includes("save") || q.includes("remember") || q.includes("sign in")){
        return "This version of Pathfolio uses your browser's local storage to remember your profile, settings and records on the same device. A future online version could use a secure database so accounts work across devices.";
    }

    if(q.includes("hello") || q.includes("hi ") || q==="hi"){
        return "Hello! I'm glad you're exploring Pathfolio. You can ask me about certificates, projects, achievements, personalization or the purpose of the app.";
    }

    return "That's a good question! I'm currently the Pathfolio Assistant, so I know best about how Pathfolio works. Try asking me about certificates, achievements, projects, personalization, portfolios or getting started.";
}

function itemModal(type,id){
    const config=configFor(type);
    const item=id?records[type].find(x=>x.id===id)||{}:{};

    const fields=config.fields.map(([key,label,fieldType,required])=>{
        if(fieldType==="select"){
            return `<div class="field"><label>${label}</label>
                <select id="f-${key}">
                    ${categories.map(c=>`<option ${item[key]===c?"selected":""}>${c}</option>`).join("")}

            return `<div class="field full"><label>${label}</label>
                <textarea id="f-${key}" ${required?"required":""}>${esc(item[key]||"")}</textarea></div>`;
        }

        return `<div class="field"><label>${label}</label>
            <input id="f-${key}" type="${fieldType}" value="${esc(item[key]||"")}" ${required?"required":""}>
        </div>`;
    }).join("");

    const photo=type==="certificates"?`
        <div class="field full">
            <label>Certificate verification photo</label>
            <label class="upload-box">
                <strong>Add a photo to verify</strong>
                Upload a photo or screenshot of your certificate.
                <input id="certificate-photo" type="file" accept="image/*">
            </label>
            <img id="photo-preview" class="photo-preview"
                ${item.photo?`src="${item.photo}" style="display:block"`:""} alt="Preview">
        </div>`:"";

    return `
    <div class="modal-back" id="modal">
        <section class="modal">
            <div class="modal-head">
                <h2>${id?"Edit":"Add"} ${config.title.toLowerCase()}</h2>
                <button class="close" data-action="close">×</button>
            </div>

            <form id="item-form" data-type="${type}" data-id="${id||""}">
                <div class="form-grid">${fields}${photo}</div>
                <div class="actions">
                    <button class="btn primary" type="submit">Save</button>
                    <button class="btn" type="button" data-action="close">Cancel</button>
                </div>
            </form>
        </section>
    </div>`;
}

/* ── Click events ── */

document.addEventListener("click",event=>{
    const button=event.target.closest("button");
    if(!button)return;

    if(button.dataset.tab){
        tab=button.dataset.tab;
        renderView();
        return;
    }

    const action=button.dataset.action;

    if(action==="close")$("#modal")?.remove();

    if(action==="home")landing();

    if(action==="about")aboutPage();

    if(action==="start"){
        $("#modal")?.remove();
        authModal("signup");
    }

    if(action==="signin"){
        $("#modal")?.remove();
        authModal("login");
    }

    if(action==="dashboard"){
        if(user)app();
        else authModal("login");
    }

    if(action==="signout"){
        user=null;
        localStorage.removeItem("pathfolio-user");
        landing();
        notify("Signed out successfully");
    }

    if(action==="demo"){
        user={id:"demo-user",email:"demo@example.com"};
        profile.full_name="Demo User";
        profile.email=user.email;
        tab="Overview";
        saveData();
        app();
        notify("Welcome to the demo!");
    }

    if(action==="new-certificate"){
        document.body.insertAdjacentHTML("beforeend",itemModal("certificates"));
    }

    if(button.dataset.new){
        document.body.insertAdjacentHTML("beforeend",itemModal(button.dataset.new));
    }

    if(button.dataset.edit){
        document.body.insertAdjacentHTML("beforeend",
            itemModal(button.dataset.edit,button.dataset.id));
    }

    if(button.dataset.delete){
        const type=button.dataset.delete;
        if(confirm("Are you sure you want to delete this item?")){
            records[type]=records[type].filter(x=>x.id!==button.dataset.id);
            saveData();
            renderView();
            notify("Item deleted");
        }
    }

    if(action==="toggle-publish"){
        profile.portfolio_published=!profile.portfolio_published;
        saveData();
        renderView();
        notify(profile.portfolio_published?"Portfolio published":"Portfolio is now private");
    }

    if(button.dataset.theme){
        const themes={
            classic:{accent:"#4c8dff",background:"#05070b"},
            purple:{accent:"#9b7bff",background:"#090711"},
            emerald:{accent:"#42d6a4",background:"#05100d"}
        };

        settings={...settings,...themes[button.dataset.theme]};
        applyTheme();
        saveData();

        if(tab==="App Personalization")personalizationView($("#view"));
    }
});

/* ── Image uploads ── */

document.addEventListener("change",event=>{
    const input=event.target;
    const file=input.files?.[0];
    if(!file)return;

    if(input.id==="certificate-photo" || input.id==="profile-photo-input"){
        const reader=new FileReader();

        reader.onload=e=>{
            const preview=input.id==="certificate-photo"
                ?$("#photo-preview")
                :$("#profile-photo-preview");

            if(preview){
                preview.src=e.target.result;
                preview.style.display="block";
            }
        };

        reader.readAsDataURL(file);
    }
});

/* ── Form submissions ── */

document.addEventListener("submit",event=>{
    const form=event.target;

    if(!["auth-form","profile-form","personalization-form","item-form"].includes(form.id))return;

    event.preventDefault();

    if(form.id==="auth-form"){
        user={
            id:"local-user",
            email:$("#email").value
        };

        if($("#name"))profile.full_name=$("#name").value;
        if(!profile.full_name)profile.full_name="Pathfolio User";

        profile.email=user.email;

        saveData();
        $("#modal")?.remove();
        tab="Overview";
        app();
        notify("Welcome to Pathfolio!");
    }

    if(form.id==="profile-form"){
        ["full_name","grade","school_name","username","bio"].forEach(key=>{
            profile[key]=$(`#p-${key}`)?.value||"";
        });

        profile.skills=$("#p-skills").value.split(",").map(x=>x.trim()).filter(Boolean);
        profile.interests=$("#p-interests").value.split(",").map(x=>x.trim()).filter(Boolean);

        saveData();
        notify("Profile updated successfully");
    }

    if(form.id==="personalization-form"){
        settings.accent=$("#accent-color").value;
        settings.background=$("#background-color").value;

        const photo=$("#profile-photo-preview");
        if(photo?.src?.startsWith("data:image"))profile.photo=photo.src;

        applyTheme();
        saveData();
        notify("Personalization saved!");
    }

    if(form.id==="item-form"){
        const type=form.dataset.type;
        const id=form.dataset.id;
        const config=configFor(type);

        const data={
            id:id||Date.now().toString(),
            _type:type,
            created_at:new Date().toISOString()
        };

        config.fields.forEach(([key,,fieldType])=>{
            const element=$(`#f-${key}`);
            if(element)data[key]=element.value;
        });

        if(type==="certificates"){
            const preview=$("#photo-preview");

            if(preview?.src?.startsWith("data:image")){
                data.photo=preview.src;
            }else if(id){
                const old=records[type].find(x=>x.id===id);
                if(old?.photo)data.photo=old.photo;
            }
        }

        if(id){
            const index=records[type].findIndex(x=>x.id===id);
            records[type][index]={...records[type][index],...data};
        }else{
            records[type].push(data);
        }

        saveData();
        $("#modal")?.remove();
        renderView();
        notify(`${config.title} saved successfully`);
    }
});

/* ── Start ── */

loadData();
landing();

})();
</script>
</body>
</html>
